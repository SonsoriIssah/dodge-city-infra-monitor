name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest (PostGIS) + node tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: infra
          POSTGRES_USER: infra
          # Throwaway credential of a database that exists only for this job; not a secret.
          POSTGRES_PASSWORD: ci-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infra -d infra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: infra
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: ci-throwaway-password
      # The integration tests (marker "db") create and use the database infra_test; an unreachable PostGIS is an
      # error here instead of a skip.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests (pytest, PostGIS service container)
        run: python -m pytest -q -m "not slow"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dashboard unit tests (node --test)
        run: node --test dashboard/tests
